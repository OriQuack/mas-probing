[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minpilot"
version = "0.1.0"
description = "Minimal orchestrator-worker framework for testing pre-delegation worker probing (GAIA pilot, no OWL)."
requires-python = ">=3.11"
# Runtime deps are pinned per conda env under envs/, not here.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
