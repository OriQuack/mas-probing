# Stage 2 (E8, R21): the comparison arm of c2_probe_tools. No probe: the orchestrator side reads the original task,
# the context and the draft, chooses the checks itself, delegates them to the executor, then rewrites (it still gets
# real worker reports, unlike self-simulation). Equalising access and total budget with c2_probe_tools is deferred
# (R21); the c2 budget as is.
name: c2_direct_check
kind: direct_check
prompts: r8
probe_workers: executor
max_verifications: 2
verify_max_tool_calls: 10
budget: {max_llm_calls: 60, max_cost_usd: 1.0, max_worker_calls: 8}
