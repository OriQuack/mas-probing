# Variant of C: as C_probe, plus up to 2 follow-up questions to the probed workers and one re-analysis. B has no
# counterpart for follow-ups, so C_probe_followup - B is not a clean "source of answers" contrast; compare it with
# C_probe instead.
name: C_probe_followup
kind: probe
questions: [understanding, assumptions, failure, plan]
samples_per_worker: 1
probe_tools: false
max_followups: 2
max_verifications: 2
verify_max_tool_calls: 10
connect_probe_to_execution: false
budget: {max_llm_calls: 60, max_cost_usd: 1.0, max_worker_calls: 8}
