# Ask the executor with up to three tool calls in an isolated workspace.
name: executor_probe_tools
kind: probe
probe_workers: executor
samples_per_worker: 1
probe_tools: true
probe_max_tool_calls: 3
max_followups: 0
max_verifications: 2
verify_max_tool_calls: 10
connect_probe_to_execution: false
budget:
  max_llm_calls: 60
  max_cost_usd: 1.0
  max_worker_calls: 8
