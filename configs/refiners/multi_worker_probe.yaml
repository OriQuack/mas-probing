# Ask executor Luna and probe-only Haiku independently; up to three tool calls each.
name: multi_worker_probe
kind: probe
probe_workers:
- executor
- gen_haiku
samples_per_worker: 1
probe_tools: true
probe_max_tool_calls: 3
max_followups: 0
max_verifications: 2
verify_max_tool_calls: 10
connect_probe_to_execution: false
budget:
  max_llm_calls: 60
  max_cost_usd: 1.0
  max_worker_calls: 8
