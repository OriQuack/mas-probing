# Ask the executor once without tools, then analyze, verify and rewrite.
name: executor_probe
kind: probe
probe_workers: executor
samples_per_worker: 1
probe_tools: false
max_followups: 0
max_verifications: 2
verify_max_tool_calls: 10
connect_probe_to_execution: false
budget:
  max_llm_calls: 60
  max_cost_usd: 1.0
  max_worker_calls: 8
