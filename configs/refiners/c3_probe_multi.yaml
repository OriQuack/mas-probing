# Condition 3 (decisions R20-R23, E7, E9, P7): several workers asked. Each listed worker answers the probe
# independently (separate conversations and scratch workspaces, not shown each other's answers); the analysis sees
# the answers anonymously ("respondent k", order shuffled per delegation, R23), compares the answer sets and decides
# which issues change the result; checks run through the executor; one rewrite.
# Heterogeneous (user's choice, stage 4): the executor (Luna) + a probe-only Haiku 5.5 worker of the `multi` pool.
# Probes use tools (user, stage 4: every probe condition uses tools), up to 3 calls each, like c2_probe_tools.
# c3 - c2_probe_tools = one more answer set (another model) + the comparison.
name: c3_probe_multi
kind: probe
prompts: r8
probe_workers: [executor, gen_haiku]
samples_per_worker: 1
probe_tools: true
probe_max_tool_calls: 3
max_followups: 0
max_verifications: 2
verify_max_tool_calls: 10
connect_probe_to_execution: false
budget: {max_llm_calls: 60, max_cost_usd: 1.0, max_worker_calls: 8}
