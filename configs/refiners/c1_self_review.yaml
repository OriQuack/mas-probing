# Condition 1 (decisions R20, E7): the orchestrator revises the instruction itself. No worker is asked: the
# orchestrator-side model predicts the executor's answers to the four questions, then analysis -> checks -> rewrite
# (the same steps, prompts and limits as conditions 2 and 3).
name: c1_self_review
kind: self_review
questions: [understanding, assumptions, failure, plan]
probe_workers: executor
samples_per_worker: 1
max_verifications: 2
verify_max_tool_calls: 10
budget: {max_llm_calls: 60, max_cost_usd: 1.0, max_worker_calls: 8}
