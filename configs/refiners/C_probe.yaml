# Condition C: real worker probes (no tools while answering, separate conversations), then the shared
# analyze -> verify -> rewrite. No follow-ups, so C and B run the same steps after collecting answers and differ
# only in where the answers come from (review 2026-10-09, F1). C_probe_followup adds follow-up questions.
name: C_probe
kind: probe
questions: [understanding, assumptions, failure, plan]
samples_per_worker: 1
probe_tools: false
max_followups: 0
max_verifications: 2
verify_max_tool_calls: 10
connect_probe_to_execution: false
budget: {max_llm_calls: 60, max_cost_usd: 1.0, max_worker_calls: 8}
