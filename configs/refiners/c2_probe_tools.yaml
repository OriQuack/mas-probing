# Stage 2 (E8, R21): condition 2 with tools in the probe. The executor may use its tools for limited checks while
# answering (a scratch copy of the workspace, a separate conversation), up to probe_max_tool_calls. The refine log
# records the probe's tool observations (`probe_observations`) and URLs/numbers/quoted strings from them that reach
# the rewrite (`observations_in_rewrite`). Compared with c2_probe_executor (no tools) and c2_direct_check.
# Equalising access and total budget with c2_direct_check is deferred (R21); the c2 budget as is.
name: c2_probe_tools
kind: probe
prompts: r8
probe_workers: executor
samples_per_worker: 1
probe_tools: true
probe_max_tool_calls: 3
max_followups: 0
max_verifications: 2
verify_max_tool_calls: 10
connect_probe_to_execution: false
budget: {max_llm_calls: 60, max_cost_usd: 1.0, max_worker_calls: 8}
