# Redundant candidates: one generalist role; several workers (different models, same prompt and tools) could
# do every subtask. Probes ask all candidates; the executor stays fixed (gen_luna), so the effect of a better
# instruction is not mixed with worker selection.
name: redundant
workers:
  - id: gen_luna
    model: luna
    tools: [web_search, read_url, read_file, view_image, run_python]
    max_tool_calls: 20
    system_prompt: &generalist |
      You are a generalist worker. You find information on the web, read files and documents, look at images,
      and compute with Python, and you report results with their evidence.
  - id: gen_gemini
    model: gemini
    tools: [web_search, read_url, read_file, view_image, run_python]
    max_tool_calls: 20
    system_prompt: *generalist
roles:
  - id: generalist
    description: Searches the web, reads web pages, files and images, and computes with Python.
    executor: gen_luna
    probe_workers: [gen_luna, gen_gemini]
